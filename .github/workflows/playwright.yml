# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   On every push to main, builds the Docker images from docker-compose.yml and
#   runs the whole stack in containers: MySQL, the Express API, the Next.js
#   production build, and the Playwright test runner (Dockerfile.playwright,
#   official Playwright image with all browsers pre-installed). Nothing is
#   installed on the runner itself. Uploads the HTML report as an artifact.
#
# TRIGGER: push to main (and manual runs)
#
# NOTES:
#   - Same command as a local run (see README): `docker compose up ... tests`
#   - No external server or secrets: the stack lives only for the job
#   - HTML report is retained for 30 days as a downloadable artifact
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Playwright Tests (Docker)
  # ║  Builds the images, runs the stack + tests, and uploads the HTML report.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright:
    name: Run Playwright Tests in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ── Prepare output folders ───────────────────────────────────────────────
      # Created by the runner user so the bind mounts aren't root-owned.
      - name: Create report folders
        run: mkdir -p playwright-report test-results

      # ── Build images ─────────────────────────────────────────────────────────
      # backend, frontend and tests (Playwright + browsers) images
      - name: Build Docker images
        run: docker compose build

      # ── Run the stack and all Playwright tests ───────────────────────────────
      # Exit code comes from the tests container, so a test failure fails the job.
      # HOST_UID/HOST_GID let the container hand report files back to the runner user.
      - name: Run Playwright tests
        run: |
          HOST_UID=$(id -u) HOST_GID=$(id -g) \
            docker compose up --exit-code-from tests --attach tests

      # ── Collect container logs ───────────────────────────────────────────────
      - name: Collect container logs
        if: ${{ !cancelled() }}
        run: docker compose logs --no-color > compose.log

      # ── Upload HTML report as artifact ───────────────────────────────────────
      # `!cancelled()` uploads the report whether tests passed or failed.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      # ── Upload container logs on failure ─────────────────────────────────────
      - name: Upload container logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs-${{ github.run_id }}
          path: compose.log
          retention-days: 7

      # ── Cleanup ──────────────────────────────────────────────────────────────
      - name: Stop containers
        if: always()
        run: docker compose down -v
